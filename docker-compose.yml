version: '3.8'

services:
  neo4j:
    image: neo4j:5.26.0
    container_name: cyber_triage_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - ./outputs/neo4j_csv:/var/lib/neo4j/import
      - ./neo4j:/neo4j_scripts
      - neo4j_data:/data
    networks:
      - triage_net

  grafana:
    image: grafana/grafana:latest
    container_name: cyber_triage_grafana
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana SOC Dashboard UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=neo4j-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - neo4j
    networks:
      - triage_net

networks:
  triage_net:
    driver: bridge

volumes:
  neo4j_data:
  grafana_data:
